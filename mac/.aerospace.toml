# Windows App (Microsoft Remote Desktop) — float all windows so AeroSpace
# never tiles or repositions them; preserves native Windows App behaviour.
[[on-window-detected]]
if.app-id = 'com.microsoft.rdc.macos'
run = 'layout floating'

[[on-window-detected]]
if.window-title-regex-substring = 'LocalSend'
run = 'layout floating'


[[on-window-detected]]
if.window-title-regex-substring = 'Latest'
run = 'layout floating'

# Keep the restore confirmation dialog out of the tiling tree.
[[on-window-detected]]
if.window-title-regex-substring = '(?i)AeroSpace Snapshot Restore'
run = 'layout floating'

