# Pane keybinds from the Mac Ghostty config. Included from ~/.config/ghostty/config.
# performable: lets the keys fall through to the shell/nvim when there is no split to move to.
keybind = performable:ctrl+h=goto_split:left
keybind = performable:ctrl+j=goto_split:down
keybind = performable:ctrl+k=goto_split:up
keybind = performable:ctrl+l=goto_split:right

# cmd+d on the Mac -> super+d (free in Hyprland). Split down stays on Ghostty's ctrl+shift+e,
# because Omarchy binds super+shift+d to Docker.
keybind = super+d=new_split:right
